# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.
#
# 项目结构：手写多项目 Gradle（common / fabric / forge / neoforge），
# 三个平台子项目各自产出 <平台>/build/libs/BetterItemStack-<mc>-<平台>-<版本>.jar。
#
# 推送任意 tag（v1.0.1 / 1.0.1 / V1.0.1 均可）时，会额外从 CHANGELOG.md 抽取该版本的小节，
# 自动创建 GitHub Release 并把三个平台的 jar 一起作为附件上传。
# Release 标题会带上本分支的 MC 支持区间，形如 "v1.0.0 (Minecraft 1.20.1)"。
# 详见文件末尾的两个步骤。
#
# 注意：不要在这里把条件收紧成只认 "v" 前缀。曾经因为写成 refs/tags/v*，
# 而实际 tag 名为 1.0.1，导致推送 tag 后 Release 完全没有被创建、也没有任何报错。
# 版本号统一用下面 extract 步骤里的 ${TAG#[vV]} 归一化即可。
#
# tag 约定：只用版本号，不要把 MC 区间写进 tag（区间由产物名与 Release 标题承担）。
# 若把区间写进 tag，归一化后的名字匹配不到 CHANGELOG 的 "## <版本号>" 小节，
# 会静默回退成把整份 CHANGELOG 当作 Release 正文。

name: build
on: [pull_request, push]

# gh release 需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          # Gradle 守护进程需要 21；编译用的 toolchain 由 gradle.properties 的
          # java_version 决定（1.20.1 分支为 17），foojay 解析器会自动补下。
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          # 三个平台子项目各自的产物目录。
          # 注意不要写成 build/libs：那里只有根项目的目录，而根项目不产 jar；
          # 也不要用 */*/build/libs：那会把 build/devlibs 里未重混淆的中间产物一起收进来。
          path: |
            fabric/build/libs/*.jar
            forge/build/libs/*.jar
            neoforge/build/libs/*.jar

      # ------------------------------------------------------------------
      # 以下是"打 tag 时自动发布 Release"的部分。
      # 普通 push / PR 不会执行（两个步骤都带 if 条件）。
      # ------------------------------------------------------------------

      - name: extract release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 归一化：先剥掉可选的 v/V 前缀，再丢掉 semver 的 +build-metadata 后缀
          # （后者让 v1.0.3+mc1.21.1-1.21.4 这类写法也能正确匹配 CHANGELOG 小节）
          VERSION="${TAG#[vV]}"
          VERSION="${VERSION%%+*}"
          echo "标签：$TAG    版本：$VERSION"

          # 抽取 "## <版本号>" 开头、到下一个标题或 --- 分隔线之前的内容
          awk -v ver="$VERSION" '
            BEGIN { pat = "^## " ver "([^0-9.]|$)" }
            $0 ~ pat { found = 1; next }
            found && ($0 ~ /^## / || $0 == "---") { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md 中没有与 $VERSION 对应的小节，Release 正文将使用整个 CHANGELOG。"
            cp CHANGELOG.md release-notes.md
          fi

          echo "-------- release-notes.md --------"
          cat release-notes.md

      - name: create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # 标题带上本分支的 MC 支持区间（与 gradle.properties 同源），
          # 这样从 tag 列表里也能一眼看出该版本覆盖哪些 MC 版本。
          # min 与 max 相同时（单版本分支，如 1.20.1 / 1.21.11）折叠成一个。
          MC_MIN=$(sed -n 's/^minecraft_version_min=//p' gradle.properties | tr -d '[:space:]')
          MC_MAX=$(sed -n 's/^minecraft_version_max=//p' gradle.properties | tr -d '[:space:]')
          if [ "$MC_MIN" = "$MC_MAX" ]; then MC_RANGE="$MC_MIN"; else MC_RANGE="$MC_MIN–$MC_MAX"; fi
          TITLE="$TAG (Minecraft $MC_RANGE)"
          echo "Release 标题：$TITLE"

          # 收集三个平台的产物。只上传主 jar：
          #   - 排除 -sources.jar（历史 tag 指向的旧提交仍可能生成它）；
          #   - build/devlibs 里是未重混淆的中间产物，不在收集范围内。
          JARS=()
          for d in fabric/build/libs forge/build/libs neoforge/build/libs; do
            if [ ! -d "$d" ]; then echo "跳过不存在的目录 $d"; continue; fi
            for f in "$d"/*.jar; do
              [ -e "$f" ] || continue
              case "$f" in
                *-sources.jar) echo "跳过 $f" ;;
                *) JARS+=("$f") ;;
              esac
            done
          done
          if [ ${#JARS[@]} -eq 0 ]; then
            echo "::error::没有找到任何 jar 产物，Release 中止。"
            exit 1
          fi
          printf '将上传：\n%s\n' "${JARS[@]}"

          # 幂等：同一个 tag 重跑工作流时更新已有 Release，而不是报"已存在"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，改为更新。"
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
            gh release upload "$TAG" "${JARS[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --verify-tag \
              "${JARS[@]}"
          fi

          echo "完成：$(gh release view "$TAG" --json url -q .url)"
