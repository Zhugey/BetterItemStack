// ===========================================================================
// common —— 平台无关的公共源码
//
// 本身不产出任何被依赖的 jar，只把源码/资源目录"发布"成两个配置供平台子项目取用
//（见 buildSrc/.../multiloader-loader.gradle）。
//
// 这里应用 ModDevGradle 的 **本体（非 legacy）** 插件，走 NeoForm 模式：
// 它只加 vanilla Minecraft（带官方映射），不会把 NeoForge 拖进来，从而让 common
// 在 IDE 里能独立编译与索引。1.21.1 上不能再用 legacyforge —— 那个变体只覆盖
// 1.17 – 1.20.1，它的 mcpVersion 模式也随之失效（MCP 没有 1.21.1 版本）。
// ===========================================================================
plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
