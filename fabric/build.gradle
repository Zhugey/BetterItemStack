// ===========================================================================
// fabric —— Fabric 平台（26.2）
//
// ⚠ 26.x **不混淆**（Mojang 的 downloads 只剩 client/server，没有 mappings 文件），
//   因此：
//   ① 插件 id 必须用 **`net.fabricmc.fabric-loom`**（LoomNoRemapGradlePlugin，不混淆模式）。
//      旧 id `fabric-loom`（LoomGradlePlugin）是 remap 模式，会去找 Mojang mappings 而失败。
//      三个 id 的对应关系见根 build.gradle 的注释。
//   ② **没有 mappings 那一行**：不混淆 jar 里的类名本身就是官方名，与 Forge / NeoForge
//      的运行期命名一致，"全平台统一官方映射"这个前提反而更直接地成立。
//   ③ 依赖用 `implementation` 而不是 `modImplementation`（Fabric 官方 26.2 模板同款）。
//   ④ 不写 `loom { mixin { ... } }`：没有名字需要重映射 ⇒ 不需要 refmap，
//      mixins.json 里也去掉了 "refmap" 键（Fabric 官方 26.2 模板的 mixins.json 同样没有）。
// ===========================================================================
plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // ⚠ loader 必须 ≥0.19.5（见 gradle.properties 与该版本号的注释）：0.19.4 内嵌
    //    `mixinextras-fabric 0.5.4`，它扫描任何 `@Redirect` 时会把 `@Redirect#at()`（`At[]`，数组形态）
    //    当成单个 AnnotationNode 强转 ⇒
    //      ClassCastException: java.util.ArrayList cannot be cast to org.objectweb.asm.tree.AnnotationNode
    //      ⇒ MixinTransformerError: Mixin transformation of … failed ⇒ BootstrapMethodError ⇒ 游戏进不去。
    //    ⚠ 与 `@At` 的内容无关，只要混入类里有**任何** `@Redirect` 就中招（本项目 3 个）⇒ **构建期完全看不出来**。
    //    0.5.5 改成遍历 `Annotations.getValue(redirect, "at", true)` 拿到的 List（上游 LlamaLad7/MixinExtras@78b31b1；
    //    同类报告 ImmediatelyFast#584、YetAnotherConfigLib#369。Fabric Loader **0.19.5** 起内嵌 0.5.5）。
    // ⚠ 另一种修法是"不改 loader、自己带一份 0.5.5"：
    //      include(implementation("io.github.llamalad7:mixinextras-fabric:0.5.5"))
    //    它能跑（运行时由 MixinExtras 服务协商取较高版本），但会把 jar 从 131KB 撑到 765KB。
    //    本分支**选抬 loader**（不增体积），故这里不再自带。
    // ⚠ 只有 Fabric 中招：Forge 用上游 Mixin（`At at()` 是**单值**）、NeoForge 26.2 自带 0.5.5。
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    // Fabric API 按 MC 小版本一条独立版本线，必须选对 +MC 那条（已在 gradle.properties 固定）。
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

loom {
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('run')
            // 开发环境用原版的"离线开发者模式"（vanilla `Main` 的 `--offlineDeveloperMode` 开关）。
            // 不开它，dev 客户端每次启动都会刷 4 条假的 ERROR：
            //   Failed to fetch user properties / Failed to retrieve profile key pair
            //   （MinecraftClientHttpException … status=401 … path=/player/certificates）
            //   Failed to fetch Realms feature flags / Couldn't connect to realms
            // 成因：Loom 的 dev 会话是**假账号**（用户名 Player###、accessToken 是字面量 "FabricMC"），
            // 而客户端仍会去 Mojang 取"聊天签名密钥对"、取玩家属性、查 Realms ⇒ 全部 401。
            // 开了之后 `Minecraft` 会用 `UserApiService.OFFLINE` + `ProfileKeyPairManager.EMPTY_KEY_MANAGER`，
            // 这些请求根本不会发出（RealmsClient/RealmsAvailability 也直接短路返回）。
            // ⚠ 只影响 dev 运行参数，**不进 jar、不影响任何玩家**；代价是 dev 里聊天不能签名（本来也签不了）。
            programArgs '--offlineDeveloperMode'
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('run')
        }
    }
}
