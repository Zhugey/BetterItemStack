// ===========================================================================
// forge —— MinecraftForge 1.21.11（ForgeGradle 7）
//
// 为什么 1.21 一代不能用 ModDevGradle legacyforge：
//   - MDG 的 legacyforge 变体只覆盖 1.17 – 1.20.1（它依赖的 MCP 也没有 1.21 版本）。
//
// ⚠ 1.21.11 相对 1.21.1 的三处硬变化（均在 Forge 官方 MDK / MDKExamples 上核对过）：
//   1. **ForgeGradle 必须升到 7.x**（MDK 写的是 `[7.0.3,8)`），而 FG7 **要求 Gradle ≥ 9.3.0**
//      ⇒ 本分支 wrapper 从 8.14.2 升到 9.4.1（连带上 Loom 1.15、mixin 插件 0.7.38 → 干脆去掉）。
//   2. **不再使用 Sponge 的 Mixin Gradle 插件**。它（含 0.7-SNAPSHOT 与 0.7.38）在 Gradle 9 下
//      会因用到已删除的 `org.gradle.util.VersionNumber` 而无法创建 MixinExtension；
//      Forge 官方 FG7 示例也已不用它。改由本脚本手工承担它原来的两件事：
//        - 混入 AP：`annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'`
//        - 运行期混入配置：jar 清单的 `MixinConfigs` + 运行参数 `--mixin.config=...`
//   3. FG7 的运行配置改用 `register('client' / 'server' / 'data')`，任务名随之变成
//      `runClient` / `runServer` / `runData`（与 Fabric / NeoForge 统一，不再叫 `Client` / `Server`）。
//
// 不变的好消息：**1.20.6 起 Forge 运行期就是官方命名** ⇒ 不需要重混淆、也不需要 refmap，
//   `build/libs` 里的就是成品。
// ===========================================================================
plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle'
}

// 正式环境靠这条：FML 读混入配置的唯一入口就是 jar 清单的这个属性
//（Forge 侧既不认 mods.toml 的 [[mixins]]，自身也没有任何 "MixinConfigs" 常量）。
// 缺了它，构建全绿、进游戏后混入静默不生效。FG7 官方示例就是这么写的。
jar {
    manifest {
        attributes["MixinConfigs"] = "${mod_id}.mixins.json"
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    // FG7 的 runs 用 register(...)，任务名随之变成 runClient / runServer / runData
    //（FG6 时代是 runs { client { taskName 'Client' } } → 叫 Client / Server）。
    runs {
        configureEach {
            // ⚠ FG7 这里改了名与类型：FG6 是 `workingDirectory file('run')`，
            //   FG7 是 `workingDir`（DirectoryProperty，必须用 = 或 .convention 赋 Provider）。
            workingDir = layout.projectDirectory.dir('run')

            // 开发环境靠这条参数加载混入配置 —— 原来由 Sponge 插件自动注入，
            // 插件移除后必须自己加（FG7 官方示例同样如此）。
            args "--mixin.config=${mod_id}.mixins.json"

            // 控制台中文乱码修复（forge / neoforge 同因同解，fabric 不受影响）。
            // 成因：Forge 侧的 console appender 是 FML log4j2.xml 里的 net.minecrell
            //   TerminalConsoleAppender，它的 append() 无条件 System.out.print(String)，
            //   于是输出编码 = JVM 的 stdout.encoding；而 JDK 18 起（JEP 400）该值在
            //   「未连控制台」（IDE / Gradle 都是管道）时回落到 native.encoding
            //   —— 中文 Windows 即 GBK，IDE 按 UTF-8 解码 ⇒ 乱码。游戏内与 logs/latest.log
            //   都不经过 stdout ⇒ 正常；fabric 走 log4j2 原生 ConsoleAppender，同样不受影响。
            // ⚠ 只加 -Dfile.encoding=UTF-8 无效（实测），必须显式设 stdout / stderr.encoding。
            // ⚠ FG7 把 FG6 的 `property(...)` 改名为 `systemProperty(...)`。
            systemProperty 'stdout.encoding', 'UTF-8'
            systemProperty 'stderr.encoding', 'UTF-8'

            // ---- JDK 25 的 JVM 原生告警（都走 stderr ⇒ IDEA 里一片红，与本 Mod 无关）----
            //   `sun.misc.Unsafe::objectFieldOffset` 的 "terminally deprecated"（JEP 498）：
            //   调用方是 **Forge 自己的** net.minecraftforge.unsafe.UnsafeHacks（unsafe-0.9.2.jar），
            //   客户端与服务端都会出现。`allow` 只把该告警降为静默，不改变任何可用性。
            //   ✅ 实测：加之前 3 行、加之后 0 行。
            jvmArgs '--sun-misc-unsafe-memory-access=allow'

            // ⚠ **不要**在这里加 `--enable-native-access=<模块>` 去消 JEP 472 的
            //   `java.lang.System::load` → "A restricted method …" 那一批。**实测它反噬**：
            //   `--enable-native-access=com.sun.jna,org.jline.nativ,org.lwjgl,…` 之后，
            //   JVM 逐条打印 `WARNING: Unknown module: <名> specified to --enable-native-access`（7 条），
            //   而原来的 "A restricted method" 7 条**一条都没少**。
            //   原因：`--enable-native-access` 只对 **boot layer** 的模块有效，而 JNA / JLine / LWJGL
            //   是 ModLauncher 在**子 ModuleLayer** 里加载的 ⇒ 启动参数里点名它们必然 "Unknown module"。
            //   `ALL-UNNAMED` 也覆盖不到具名模块（实测）；`ALL-MODULE-PATH` JDK 25 **不认**。
            //   ⇒ 这批告警在 Forge dev 下**无法从启动参数消除**（要消只能等上游在 jar 清单里加
            //     `Enable-Native-Access` 属性 —— LWJGL 3.4.1 还没有）。它们本身无害，留着即可。
            //
            // ⚠ 同理，ModLauncher 的 `Ignoring duplicate module on SecureModuleFinder`（本项目 dev
            //   客户端每次 23 行）是**裸输出、没有开关**，也不要试图从这边消。
        }

        register('client') {
            // 开发环境用原版的"离线开发者模式"（vanilla `Main` 的 `--offlineDeveloperMode` 开关）。
            // 不开它，dev 客户端每次启动都会刷 2 条假的 ERROR：
            //   Failed to fetch Realms feature flags / Couldn't connect to realms
            //   （RealmsServiceException: Realms authentication error with message
            //     'java.lang.RuntimeException: Failed to parse into SignedJWT: 0'）
            // 成因：dev 是**假会话**（FG7 传的 accessToken 就是字面量 `0`，游戏内用户名 Dev），
            // 而 RealmsClient 仍会带它去请求 Realms ⇒ 鉴权失败。
            // 开了之后 `Minecraft` 走 `UserApiService.OFFLINE` +
            // `ProfileKeyPairManager.EMPTY_KEY_MANAGER`，且
            // `RealmsClient.fetchFeatureFlags()` / `RealmsAvailability.check()` 直接短路返回
            // ⇒ 这些请求根本不会发出。
            // ⚠ 只影响 dev 运行参数，**不进 jar、不影响任何玩家**；代价是 dev 里聊天不能签名（本来也签不了）。
            // 与 fabric/build.gradle 的 loom client 那处是同一个开关，两个平台对齐。
            args '--offlineDeveloperMode'
        }

        register('server') {
            args '--nogui'
        }

        // ⚠ **刻意不注册 data 运行配置**（2026-10-12 定）：本模组零 datagen（全项目没有
        //   DataGenerator / GatherDataEvent / DataProvider），src/generated 是空的。
        //   FG7 侧 register('data') 本身不报错（run 名随意），但跑出来只会是原版默认数据、
        //   并写进仓库 ⇒ 属隐患。将来真要 datagen 再按 FG7 的 runs 写法加回。
    }
}

// ⚠ 本分支**不接混入 AP**，原因链：
//   1. 本代 Forge 运行期是官方命名 ⇒ **不需要 refmap**；
//   2. 但 AP 默认会去生成 refmap，找不到混淆映射就直接报错：
//      `错误: Unable to locate obfuscation mapping for @Inject target getMaxStackSize`；
//   3. 原先喂映射给 AP 的是 Sponge 的 MixinGradle 插件 —— 它在 Gradle 9 下不可用、已移除；
//   4. 改共享的 mixins.json 去掉 refmap 键也不行：fabric 侧必须保留它（产物要重映射到 intermediary）；
//      传 `-AdisableTargetExport/-AdisableTargetValidator` 实测也无效（选项名不对或该版本不认）。
//   代价：失去 AP 的编译期目标校验。可以接受 —— 本项目对混入的判据本来就是「启动日志」
//   而非构建期（见 MEMORY：构建全绿 ≠ 混入生效，只有 run/logs/latest.log 算数）。
// TODO(1.21.11)：若将来查清 Mixin 0.8.7 AP 的正确选项名，可在保留 AP 的同时关掉 refmap 生成。

repositories {
    // FG7 不再隐式注册这几个仓库，必须显式声明（与官方示例一致）。
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

dependencies {
    // ⚠ FG7 换了依赖 DSL：FG6 的 `minecraft "net.minecraftforge:forge:..."` 已不存在，
    //   改为扩展方法 `minecraft.dependency(...)`（官方示例同款）。
    //   它返回的是 FG 的 patcher 依赖，会走 FG 的 userdev 处理流程。
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    // 见上方说明：本分支刻意不加 mixin 注解处理器。

    // Forge 自带的 hack 修复：强制 jopt-simple 用 5.0.4（见 Forge 官方 MDK）。
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}

// ⚠ 必须把每个 source set 的 class 与 resource 输出到**同一个目录**。
// 默认布局下 class 在 build/classes/java/main、资源在 build/resources/main，
// FML 会把它们当成**两个**模组根 → 模块层里出现两个模块（classes 那边按目录名成了
// "main"，资源那边按 modid 成了 "betteritemstack"），而两者都导出
// com.zhugey.betteritemstack.*，于是 JPMS 直接拒绝启动：
//   java.lang.module.ResolutionException: Modules betteritemstack and main
//   export package com.zhugey.betteritemstack.forge to module net.minecraftforge.forge
// 构建期完全看不出问题，只在 runClient/runServer 时炸。
// 这段与官方 MultiLoader-Template 1.21.1 的 forge 子项目逐字一致。
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

// ===========================================================================
// 把游戏 JVM 的 **stderr** 从控制台挪到文件（只影响 dev 运行，不进 jar）
//
// 起因：JDK 25 会在游戏 JVM 的 stderr 上打印两类"原生访问"提示 ——
//   · JEP 472：`A restricted method in java.lang.System has been called` +
//              `Use --enable-native-access=<模块>`（调用方是 LWJGL / JNA / JLine）
//   · JEP 498：`sun.misc.Unsafe::objectFieldOffset` 的 "terminally deprecated"
//              —— 这一条已由上面的 `--sun-misc-unsafe-memory-access=allow` 消掉
// 再加上 ForgeGradle 的 slime launcher 自己打的
//   `Ignoring duplicate module on SecureModuleFinder: org.lwjgl.*.natives …`（每次 23 行）。
// 它们**都不是错误**，而且**无法从启动参数消除**：
//   · FG7 其实已经传了 `--enable-native-access=ALL-UNNAMED`（见它生成的
//     `build/minecraftforge/forgegradle/slimeLauncherMetadataForForge/metadata/minecraft/version.json`
//     的 `arguments.jvm[4]`），但 slime launcher 把 MC 的库放在 **module path** 上、
//     由 ModLauncher 在**子 ModuleLayer** 里加载 ⇒ `ALL-UNNAMED` 覆盖不到具名模块，
//     而点名模块会报 `WARNING: Unknown module: … specified to --enable-native-access`（实测反噬）。
//   · `Ignoring duplicate module` 是裸输出，没有开关。
// 对照：NeoForge 的 MDG 只传同一个 `ALL-UNNAMED`，但它把库放在 **classpath** ⇒ 一条都不刷。
//
// IDEA 会把子进程的 stderr 全部标红，所以这里把它落到文件：控制台只留 log4j 的输出
// （Forge 的 TerminalConsoleAppender 走 stdout，Mixin 的 FATAL 也走 log4j ⇒ 关键诊断照旧可见）。
// ⚠ 实测（2026-10-14）：这一手只吃掉 stderr 的部分 —— JEP 472 那 21 行确实是 stderr，会进文件；
//   而 `Ignoring duplicate module` 那 23 行是 slime launcher 用 **stdout** 打的（System.out.println，
//   裸输出无前缀），**留在控制台**。好在 IDEA 只把 stderr 标红 ⇒ 改完之后"红字"消失，
//   剩 23 行是普通颜色。**不能改用 stdout 重定向**，那会把整个游戏日志一起吞掉。
// ⚠ 这是"移出视线"不是"消除"：JVM 级别的真实报错（原生崩溃摘要等）也会进这个文件，
//   排查时去 `build/<runClient|runServer>-jvm-stderr.log` 看。
// ===========================================================================
tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach { task ->
    def stderrFile = layout.buildDirectory.file("${task.name}-jvm-stderr.log").get().asFile
    def stream
    task.doFirst {
        stderrFile.parentFile.mkdirs()
        stream = new FileOutputStream(stderrFile, true)
        task.errorOutput = stream
    }
    task.doLast { stream?.close() }
}
