# ===========================================================================
# BetterItemStack —— 唯一的版本来源
#
# 约定：所有需要填版本/元数据的地方（build.gradle、buildSrc 约定插件、
# fabric.mod.json、mods.toml、*.mixins.json）一律引用本文件字段，
# 任何地方都不得再写死版本字面量。
#
# 本分支：一个分支只对应一个 MC 版本（minecraft_version_min == minecraft_version_max）。
# ===========================================================================

# ----- 构建环境 -----
# MC 反编译与重映射比较吃内存。
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.daemon=false

# ----- 本分支目标 MC -----
# 编译目标 == 支持区间（单版本分支，区间只是形式上保留三个字段，便于脚本统一读取）。
minecraft_version=1.21.1
minecraft_version_min=1.21.1
minecraft_version_max=1.21.1
# 供 mods.toml / fabric.mod.json 使用的区间表达式。
minecraft_version_range=[1.21.1,1.22)

# ----- Java -----
# 1.20.5 起运行环境升到 Java 21，1.21.1 必须编译成 21 字节码。
java_version=21

# ----- 构建插件 -----
# Loom 是纯构建期工具，与 MC 版本解耦，约束在 Gradle / JDK 上。
loom_version=1.13.6
# ModDevGradle：本体（非 legacy）承载 common（NeoForm）与 neoforge 两个子项目。
# 注意 legacyforge 变体只覆盖 1.17 – 1.20.1，1.21.1 用不了。
moddev_version=2.0.148
# 1.21.1 的 Forge 只能走经典 ForgeGradle。
# 1.20.6 起 Forge 运行期就是官方命名，不再需要 reobf（见 forge/build.gradle 的 reobf = false）。
forge_gradle_version=[6.0.24,6.2)
# Forge 侧的 Mixin 由 Sponge 的 Gradle 插件接入（ForgeGradle 自己不管 mixin 配置）。
mixin_gradle_version=0.7-SNAPSHOT

# ----- NeoForm -----
# common 子项目用它拿到"带官方映射的 vanilla Minecraft"，从而在 IDE 里能独立编译与索引。
# 版本表：https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430

# ----- Fabric -----
# Loader：取"该 MC 世代正式版发布后的第一个正式发布版本"。
fabric_loader_version=0.16.1
# 发布声明与编译版本分开写：loader 向后兼容，玩家门槛应写"实测可工作的最低版"，
# 这样将来抬高编译版本时不会无声抬高玩家门槛。
fabric_loader_requires=>=0.16.1
# Fabric API 与 MC 小版本一一对应，必须选对 +MC 版本线。
fabric_api_version=0.102.1+1.21.1

# ----- Forge -----
# ⚠ 1.21.1 起这里写**裸版本号**（不带 MC 前缀）：ForgeGradle 的坐标是
#   net.minecraftforge:forge:${minecraft_version}-${forge_version}，前缀由构建脚本拼。
forge_version=52.1.16
forge_version_range=[52,)
# loaderVersion 匹配的是 **javafml 语言提供者 jar 的 Implementation-Version**
#（FML 的 LanguageLoadingProvider 从 MANIFEST 读），Forge 52.1.16 那边该值是 52.1.16；
# 区间取 [52,) 与官方 MultiLoader-Template 1.21.1 分支一致（那边也是 [52,)）。
# ⚠ 不要照抄 Forge 自己 mods.toml 里的 [24,)——那是 Forge 自家模块的宽松下界，不是我们的。
forge_loader_version_range=[52,)

# ----- NeoForge -----
# 1.21.1 的 NeoForge 已是**独立实现**（坐标 net.neoforged:neoforge、modid 为 neoforge），
# 不再是 1.20.1 那种 Forge 47.x 的镜像，因此本分支的 neoforge 产物与 forge 产物互不通用。
neoforge_version=21.1.259
neoforge_version_range=[21.1,)
# 同样以官方 MultiLoader-Template 1.21.1 的值为准（[4,)）。
neoforge_loader_version_range=[4,)

# ----- Mod 元数据 -----
# 版本线从 v1.0.0 起步；1.20.1 → 1.0.x，1.21.1 → 1.1.x（tag 全局唯一，必须分开编）。
mod_version=1.1.0
maven_group=com.zhugey.betteritemstack
archives_base_name=BetterItemStack
mod_id=betteritemstack
mod_name=BetterItemStack
mod_author=zhugey
license=MIT

# ⚠ 下面两个「值」刻意写成 \uXXXX 转义，不要改回中文：
# Gradle 按 Java Properties 规范用 **ISO-8859-1** 读取本文件（`Properties.load(InputStream)`），
# 直接写中文会被读成 mojibake（`提升` → `æå`），再原样注入 mods.toml / fabric.mod.json，
# 最终在游戏内 Mods 界面显示成乱码。转义后文件为纯 ASCII，跨平台也零风险。
# 改文案时请重新生成对应的 \uXXXX 转义串，勿直接写中文。
#
# 原文：基于 develk-coder/ItemStackProMax 二次开发
credits=\u57fa\u4e8e develk-coder/ItemStackProMax \u4e8c\u6b21\u5f00\u53d1
