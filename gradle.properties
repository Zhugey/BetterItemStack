# ===========================================================================
# BetterItemStack —— 唯一的版本来源
#
# 约定：所有需要填版本/元数据的地方（build.gradle、buildSrc 约定插件、
# fabric.mod.json、mods.toml、*.mixins.json）一律引用本文件字段，
# 任何地方都不得再写死版本字面量。
#
# 本分支：一个分支只对应一个 MC 版本（minecraft_version_min == minecraft_version_max）。
# ===========================================================================

# ----- 构建环境 -----
# MC 反编译与重映射比较吃内存。
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.daemon=false

# ----- 本分支目标 MC -----
# 编译目标 == 支持区间（单版本分支，区间只是形式上保留三个字段，便于脚本统一读取）。
minecraft_version=1.20.1
minecraft_version_min=1.20.1
minecraft_version_max=1.20.1
# 供 mods.toml / fabric.mod.json 使用的区间表达式。
minecraft_version_range=[1.20.1,1.21)

# ----- Java -----
# 1.20 – 1.20.4 的运行环境是 Java 17（1.20.5 才升到 21），必须编译成 17 字节码。
java_version=17

# ----- 构建插件 -----
# Loom 是纯构建期工具，与 MC 版本解耦，约束在 Gradle / JDK 上。
# 1.13.6 是 Gradle 8.14.2 + JDK 21 下的稳定上限；永不用 -SNAPSHOT。
loom_version=1.13.6
# ModDevGradle legacyforge：承载 common / forge / neoforge 三个子项目
# （1.17 – 1.20.1 的 Forge 与早期 NeoForge）。
moddev_version=2.0.148

# ----- Fabric -----
# Loader：取"该 MC 世代正式版发布后的第一个正式发布版本"。
fabric_loader_version=0.14.22
# 发布声明与编译版本分开写：loader 向后兼容，玩家门槛应写"实测可工作的最低版"，
# 这样将来抬高编译版本时不会无声抬高玩家门槛。
fabric_loader_requires=>=0.14.22
# Fabric API 与 MC 小版本一一对应，必须选对 +MC 版本线。
fabric_api_version=0.83.1+1.20.1

# ----- Forge -----
# 编译档位取该 MC 版本的最新稳定版；发布声明用范围（下限即可）。
forge_version=1.20.1-47.4.26
forge_version_range=[47,)
forge_loader_version_range=[47,)

# ----- NeoForge（1.20.1 早期版本） -----
# 1.20.1 的 NeoForge 是 Forge 47.x 的镜像：坐标 net.neoforged:forge、包名仍是
# net.minecraftforge、modid 仍是 forge。它与 Forge 版**产物实质等价**，单独出一份
# 只是为了在 NeoForge 用户的检索场景里更直观。
neoforge_version=1.20.1-47.1.106
neoforge_version_range=[47.1,)
neoforge_loader_version_range=[47,)

# ----- Mod 元数据 -----
# 版本线从 v1.0.0 起步；1.20.1 → 1.0.x，1.21.1 → 1.1.x（tag 全局唯一，必须分开编）。
mod_version=1.0.0
maven_group=com.zhugey.betteritemstack
archives_base_name=BetterItemStack
mod_id=betteritemstack
mod_name=BetterItemStack
mod_author=zhugey
license=MIT

# ⚠ 下面两个「值」刻意写成 \uXXXX 转义，不要改回中文：
# Gradle 按 Java Properties 规范用 **ISO-8859-1** 读取本文件（`Properties.load(InputStream)`），
# 直接写中文会被读成 mojibake（`提升` → `æå`），再原样注入 mods.toml / fabric.mod.json，
# 最终在游戏内 Mods 界面显示成乱码。转义后文件为纯 ASCII，跨平台也零风险。
# 改文案时请重新生成对应的 \uXXXX 转义串，勿直接写中文。
#
# 原文：基于 develk-coder/ItemStackProMax 二次开发
credits=\u57fa\u4e8e develk-coder/ItemStackProMax \u4e8c\u6b21\u5f00\u53d1
