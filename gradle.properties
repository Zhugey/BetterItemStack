# ===========================================================================
# BetterItemStack —— 唯一的版本来源
#
# 约定：所有需要填版本/元数据的地方（build.gradle、buildSrc 约定插件、
# fabric.mod.json、mods.toml、*.mixins.json）一律引用本文件字段，
# 任何地方都不得再写死版本字面量。
#
# 本分支：一个分支只对应一个 MC 版本（minecraft_version_min == minecraft_version_max）。
# ===========================================================================

# ----- 构建环境 -----
# MC 反编译与重映射比较吃内存。
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.daemon=false

# ----- 本分支目标 MC -----
# 编译目标 == 支持区间（单版本分支，区间只是形式上保留三个字段，便于脚本统一读取）。
minecraft_version=1.21.11
minecraft_version_min=1.21.11
minecraft_version_max=1.21.11
# 供 mods.toml / fabric.mod.json 使用的区间表达式。
# ⚠ 1.21.11 是 1.x 编号的**最后一版**，之后改成「年.掉落.热修」（26.1 / 26.2 …）——不存在 1.22。
#   上界写 1.22 是形式值：它既排除 26.x，也排除任何将来的 1.21.12+。
minecraft_version_range=[1.21.11,1.22)

# ----- Java -----
# 1.20.5 起运行环境升到 Java 21；1.21.11 仍属这一代（26.1 起才升到 Java 25）。
java_version=21

# ----- 构建插件 -----
# Loom 是纯构建期工具，与 MC 版本解耦，约束在 Gradle / JDK 上。
# ⚠ 1.21.11 分支必须把 Loom 升到 1.15：ForgeGradle 7 要求 Gradle ≥ 9.3，
#   而 Loom 1.13 系是 Gradle 8 时代的产物（1.14 起才支持 Gradle 9）。Loom 1.15 要求 Gradle ≥ 9.4。
loom_version=1.15.5
# ModDevGradle：本体（非 legacy）承载 common（NeoForm）与 neoforge 两个子项目。
# 注意 legacyforge 变体只覆盖 1.17 – 1.20.1，1.21 一代用不了。
moddev_version=2.0.148
# 1.21 一代的 Forge 走经典 ForgeGradle。
# ⚠ 1.21.11 必须用 ForgeGradle 7.x：Forge 官方 MDK（1.21.11-61.2.1）写的是
#   id 'net.minecraftforge.gradle' version '[7.0.3,8)'。用 6.x 时
#   ForgeGradle 找不到 `1.21.11-61.2.1_mapped_official_1.21.11` 而直接失败。
# 1.20.6 起 Forge 运行期就是官方命名，不再需要 reobf（见 forge/build.gradle 的 reobf = false）。
forge_gradle_version=[7.0.3,8)
# ⚠ 本分支**没有** Sponge 的 Mixin Gradle 插件（原 `mixin_gradle_version` 字段已删除）：
#   它到 0.7.38 都用着 Gradle 9 已删除的 org.gradle.util.VersionNumber，装不上；
#   而 ForgeGradle 7 要求 Gradle ≥ 9.3，两者不可兼得。Forge 官方 FG7 示例也已弃用它，
#   混入改由 forge/build.gradle 手工接（AP + jar 清单 MixinConfigs + 运行参数 --mixin.config）。

# ----- NeoForm -----
# common 子项目用它拿到"带官方映射的 vanilla Minecraft"，从而在 IDE 里能独立编译与索引。
# 版本表：https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.11-20251209.172050

# ----- Fabric -----
# Loader：取"该 MC 世代正式版发布后的第一个正式发布版本"（1.21.11 于 2025-12-09 发布）。
fabric_loader_version=0.18.2
# 发布声明与编译版本分开写：loader 向后兼容，玩家门槛应写"实测可工作的最低版"，
# 这样将来抬高编译版本时不会无声抬高玩家门槛。
fabric_loader_requires=>=0.18.2
# Fabric API 与 MC 小版本一一对应，必须选对 +MC 版本线。
# ⚠ 取值口径 = "正式发布之后的第一个"：0.139.4 发布于 12-01（游戏预发布期），0.139.5 发布于 12-11。
fabric_api_version=0.139.5+1.21.11

# ----- Forge -----
# 1.21 起这里写**裸版本号**（不带 MC 前缀）：ForgeGradle 的坐标是
#   net.minecraftforge:forge:${minecraft_version}-${forge_version}，前缀由构建脚本拼。
forge_version=61.2.1
forge_version_range=[61,)
# loaderVersion 匹配的是 **javafml 语言提供者 jar 的 Implementation-Version**
#（FML 的 LanguageLoadingProvider 从 MANIFEST 读）。
# 取值与 Forge 官方 MDK（1.21.11-61.2.1）一致：mods.toml 写 loaderVersion="[61,)"、
# forge 依赖 versionRange="[61,)"。
# ⚠ 不要照抄 Forge 自己 mods.toml 里的宽松下界——那是 Forge 自家模块的，不是我们的。
forge_loader_version_range=[61,)

# ----- NeoForge -----
# 1.21 一代的 NeoForge 已是**独立实现**（坐标 net.neoforged:neoforge、modid 为 neoforge），
# 不再是 1.20.1 那种 Forge 47.x 的镜像，因此本分支的 neoforge 产物与 forge 产物互不通用。
# ⚠ NeoForge 用**自有编号**：MC 1.21.11 → 21.11.x（不是 1.21.11-x）。
neoforge_version=21.11.45
neoforge_version_range=[21.11,)
# 以官方 MultiLoader-Template 的值为准（[4,)）。
neoforge_loader_version_range=[4,)

# ----- Mod 元数据 -----
# 版本线：1.20.1 → 1.0.x，1.21.1 → 1.1.x，1.21.11 → 1.2.x（tag 全局唯一，必须分开编）。
mod_version=1.2.0
maven_group=com.zhugey.betteritemstack
archives_base_name=BetterItemStack
mod_id=betteritemstack
mod_name=BetterItemStack
mod_author=zhugey
license=MIT

# ⚠ 下面两个「值」刻意写成 \uXXXX 转义，不要改回中文：
# Gradle 按 Java Properties 规范用 **ISO-8859-1** 读取本文件（`Properties.load(InputStream)`），
# 直接写中文会被读成 mojibake（`提升` → `æå`），再原样注入 mods.toml / fabric.mod.json，
# 最终在游戏内 Mods 界面显示成乱码。转义后文件为纯 ASCII，跨平台也零风险。
# 改文案时请重新生成对应的 \uXXXX 转义串，勿直接写中文。
#
# 原文：基于 develk-coder/ItemStackProMax 二次开发
credits=\u57fa\u4e8e develk-coder/ItemStackProMax \u4e8c\u6b21\u5f00\u53d1
