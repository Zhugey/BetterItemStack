# ===========================================================================
# BetterItemStack —— 唯一的版本来源
#
# 约定：所有需要填版本/元数据的地方（build.gradle、buildSrc 约定插件、
# fabric.mod.json、mods.toml、*.mixins.json）一律引用本文件字段，
# 任何地方都不得再写死版本字面量。
#
# 本分支：一个分支只对应一个 MC 版本（minecraft_version_min == minecraft_version_max）。
# ===========================================================================

# ----- 构建环境 -----
# MC 反编译与重映射比较吃内存。
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.daemon=false

# ----- 本分支目标 MC -----
# 编译目标 == 支持区间（单版本分支，区间只是形式上保留三个字段，便于脚本统一读取）。
# ⚠ 26.x 是 Mojang 的新编号（年.掉落.热修）：26.2 = 2026 年第 2 个掉落版本，2026-06-16 发布。
minecraft_version=26.2
minecraft_version_min=26.2
minecraft_version_max=26.2
# 供 mods.toml / fabric.mod.json 使用的区间表达式。
# 上界写 26.3：既排除 26.2 之后的热修（26.2.1 等，若出现），也排除 26.3。
minecraft_version_range=[26.2,26.3)

# ----- Java -----
# 26.1 起运行环境升到 Java 25（Mojang 自 26.1 起向玩家分发 Java 25）。
java_version=25

# ----- 构建插件 -----
# Loom 是纯构建期工具，与 MC 版本解耦，约束在 Gradle / JDK 上。
# ⚠ 26.x **不混淆**（Mojang 的 downloads 只剩 client/server，没有 mappings 文件）：
#   Loom 自 1.14 起 `net.fabricmc.fabric-loom`（即 id 'fabric-loom'）就用于**不混淆**版本，
#   混淆版（≤1.21.11）才用 `net.fabricmc.fabric-loom-remap`。本分支插件 id 不用改。
# ⚠ 版本要选**晚于 26.2 发布**的：26.2 发布于 2026-06-16，Loom 1.18 发布于 2026-09-20。
#   Loom 1.18 需要 **Java 25**（用 FFM API 取代了原 native 库）⇒ Gradle daemon 必须跑在 JDK 25 上。
loom_version=1.18.4
# ModDevGradle：本体（非 legacy）承载 common（NeoForm）与 neoforge 两个子项目。
# ⚠ 26.2 需要能处理 26.x 的 MDG；2.0.148 是 1.21.11 分支所用版本，**在本分支待实测验证**，
#   不行就升（MDG 版本表：https://projects.neoforged.net/neoforged/ModDevGradle）。
moddev_version=2.0.148
# 26.x 的 Forge 仍走 ForgeGradle 7.x。
# ⚠ 版本区间取自 Forge 官方 MDK（26.2-65.1.3）的 build.gradle：id 'net.minecraftforge.gradle'
#   version '[7.0.17,8)'（1.21.11 分支用的是 [7.0.3,8)）。用 6.x 时 ForgeGradle 找不到
#   `26.2-65.1.3_mapped_official_26.2` 而直接失败。
# 26.x 起 Forge 运行期就是官方命名（26.x 干脆不混淆），不再需要 reobf。
forge_gradle_version=[7.0.17,8)
# ⚠ 本分支**没有** Sponge 的 Mixin Gradle 插件（原 `mixin_gradle_version` 字段已删除）：
#   它到 0.7.38 都用着 Gradle 9 已删除的 org.gradle.util.VersionNumber，装不上；
#   而 ForgeGradle 7 要求 Gradle ≥ 9.3，两者不可兼得。Forge 官方 FG7 示例也已弃用它，
#   混入改由 forge/build.gradle 手工接（AP + jar 清单 MixinConfigs + 运行参数 --mixin.config）。

# ----- NeoForm -----
# common 子项目用它拿到"带官方映射的 vanilla Minecraft"，从而在 IDE 里能独立编译与索引。
# 版本表：https://projects.neoforged.net/neoforged/neoform
# ⚠ 26.x 的 NeoForm 版本命名与 1.21.x 不同：不再是 `<MC>-<日期>.<时间>`，而是 `<MC>-<构建号>`
#   （例：26.2-1 / 26.2-2 / 26.2-rc-2-1）。取 `26.2-1`（2026-06-16，与 26.2 正式发布同日）。
neo_form_version=26.2-1

# ----- Fabric -----
# Loader：取"该 MC 世代正式版发布后的第一个正式发布版本"（26.2 于 2026-06-16 发布）= 0.19.4。
# ⚠ **但本分支必须 ≥0.19.5**：0.19.4 内嵌的是 `mixinextras-fabric` **0.5.4**，该版扫描任何 `@Redirect`
#   都会 `ClassCastException` ⇒ 游戏进不去；0.19.5 才换成 0.5.5（已修）。详见 fabric/build.gradle 的注释。
fabric_loader_version=0.19.5
# 发布声明与编译版本分开写：loader 向后兼容，玩家门槛应写"实测可工作的最低版"，
# 这样将来抬高编译版本时不会无声抬高玩家门槛。
# ⚠ 此处恰好等于编译版本，是**功能性硬门槛**（0.19.4 与 0.19.5 之间有 MixinExtras 0.5.4→0.5.5 的差异），
#   不是版本管理洁癖：低于 0.19.5 的 loader 会让 Fabric 端直接崩在混入应用阶段。
fabric_loader_requires=>=0.19.5
# Fabric API 与 MC 小版本一一对应，必须选对 +MC 版本线。
# ⚠ 取值口径 = "正式发布之后的第一个"：0.152.1 发布于 06-15（游戏预发布期），0.152.2 发布于 06-18。
fabric_api_version=0.152.2+26.2

# ----- Forge -----
# 26.x 起这里写**裸版本号**（不带 MC 前缀）：ForgeGradle 的坐标是
#   net.minecraftforge:forge:${minecraft_version}-${forge_version}，前缀由构建脚本拼。
forge_version=65.1.3
forge_version_range=[65,)
# loaderVersion 匹配的是 **javafml 语言提供者 jar 的 Implementation-Version**
#（FML 的 LanguageLoadingProvider 从 MANIFEST 读）。
# 取值与 Forge 官方 MDK（26.2-65.1.3）的 loaderVersion 大版本一致：[65,)。
# ⚠ 不要照抄 Forge 自己 mods.toml 里的宽松下界——那是 Forge 自家模块的，不是我们的。
forge_loader_version_range=[65,)

# ----- NeoForge -----
# 26.x 的 NeoForge 与 Forge 是**两套独立实现**（坐标 net.neoforged:neoforge、modid 为 neoforge），
# 因此本分支的 neoforge 产物与 forge 产物互不通用。
# ⚠ NeoForge 自有编号：26.x 起编号**跟上 MC 版本**（MC 26.2 → 26.2.0.x）。
#   用户 2026-10-14 指定取 26.2.0.90。
neoforge_version=26.2.0.90
neoforge_version_range=[26.2,)
# loaderVersion 下界：26.x 的取值待从 NeoForge 26.2 MDK 核对（1.21.x 那代是 [4,)）。
neoforge_loader_version_range=[4,)

# ----- Mod 元数据 -----
# 版本线：1.20.1 → 1.0.x，1.21.1 → 1.1.x，1.21.11 → 1.2.x，26.2 → 1.3.x（tag 全局唯一，必须分开编）。
mod_version=1.3.0
maven_group=com.zhugey.betteritemstack
archives_base_name=BetterItemStack
mod_id=betteritemstack
mod_name=BetterItemStack
mod_author=zhugey
license=MIT

# ⚠ 下面两个「值」刻意写成 \uXXXX 转义，不要改回中文：
# Gradle 按 Java Properties 规范用 **ISO-8859-1** 读取本文件（`Properties.load(InputStream)`），
# 直接写中文会被读成 mojibake（`提升` → `æå`），再原样注入 mods.toml / fabric.mod.json，
# 最终在游戏内 Mods 界面显示成乱码。转义后文件为纯 ASCII，跨平台也零风险。
# 改文案时请重新生成对应的 \uXXXX 转义串，勿直接写中文。
#
# 原文：基于 develk-coder/ItemStackProMax 二次开发
credits=\u57fa\u4e8e develk-coder/ItemStackProMax \u4e8c\u6b21\u5f00\u53d1
