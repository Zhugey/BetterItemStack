# 26.x 起要求 Gradle 守护进程跑在 **JDK 25** 上：
#   - Minecraft 26.1+ 本身面向 Java 25（Mojang 自 26.1 起向玩家分发 Java 25）；
#   - Loom 1.18 用 Java 25 的 Foreign Function & Memory API 取代了原来的
#     fabric-loom-native 库与 native .dll，守护进程不是 25 会直接拒绝解析插件：
#       "Dependency requires at least JVM runtime version 25. This build uses a Java 21 JVM."
# 该文件让 Gradle 自动按 toolchainVersion 选守护进程 JVM，无需命令行传 -Dorg.gradle.java.home。
# ⚠ 其它分支（1.20.1 / 1.21.1 / 1.21.11）这份文件写的是 21，不要互相覆盖。
toolchainVersion=25
