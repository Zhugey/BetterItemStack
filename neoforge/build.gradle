// ===========================================================================
// neoforge —— NeoForge 1.21.1
//
// 1.21.1 的 NeoForge 是**独立实现**（坐标 net.neoforged:neoforge、modid 为 neoforge），
// 不再是 1.20.1 那种 Forge 47.x 的镜像，所以本子项目与 forge 子项目是两套东西：
//   - 混入配置在 META-INF/neoforge.mods.toml 里用 [[mixins]] 声明（1.20.5 起改名）；
//   - 运行期就是官方命名，不需要 refmap，也不需要 reobf。
// ===========================================================================
plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version

    runs {
        client { client() }
        server { server() }

        // ⚠ **刻意不注册 data 运行配置**（2026-10-12 定）：
        //   ① 本模组零 datagen —— 全项目没有 DataGenerator / GatherDataEvent / DataProvider，
        //      资源（lang / mixins.json / mods.toml）全部手写，src/generated 是空的；
        //   ② MDG 2.x 已把 run 类型 `data` 拆成 `clientData` + `serverData`。
        //      照抄 MultiLoader-Template 的旧写法 `data { data() }` 会让
        //      :neoforge:prepareDataRun 直接失败：
        //        Trying to prepare unknown run: data.
        //        Available run types: [client, clientData, serverData, gameTestServer, server, junit]
        //   ⚠ 这个任务**只在 IDE 同步 / 跑 run 配置时才执行**，`./gradlew build` 根本不碰它
        //     ⇒ 构建全绿也照样藏着；判据是 IDEA 完整重导入（重开项目）时会立刻报出来。
        //   将来真要 datagen：写成 clientData { clientData() } / serverData { serverData() }，
        //   并自备 DataGenerator 实现。
    }

    // 控制台中文乱码修复：与 forge 侧同因同解 —— loader-4.0.45.jar 里的 log4j2.xml 就是
    // Forge 那份的复制（同样用 FML 的 TerminalConsole appender），因此它同样把输出交给
    // System.out.print(String)，编码跟着 JVM 的 stdout.encoding 走；JDK 18 起该值在无控制台
    // 时回落成 native.encoding（中文 Windows = GBK）⇒ IDE 里中文乱码。
    // 只设 file.encoding 无效，必须显式设 stdout.encoding / stderr.encoding。
    runs.all { run ->
        run.systemProperty 'stdout.encoding', 'UTF-8'
        run.systemProperty 'stderr.encoding', 'UTF-8'
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// ⚠ 这里**刻意不加** Mixin 注解处理器（与官方 MultiLoader-Template 1.21.1 的
// neoforge 子项目一致）。原因：
//   1. NeoForge 1.20.5 起运行期就是官方命名，混入不需要 refmap ⇒ AP 没有存在意义；
//   2. 混入配置由 neoforge.mods.toml 的 [[mixins]] 声明（同模板），不走 jar 清单；
//   3. 实测加上 AP 会让 :neoforge:compileJava 直接失败 —— AP 只能找到 MCP 的
//      [searge,notch] 混淆服务，却拿不到 1.21.1 的名字映射表，于是对每一个
//      @Inject/@Redirect/@Overwrite 都报
//      "Unable to locate obfuscation mapping for ... target ..."（error 级，共 11 条）。

