modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL = "https://github.com/Zhugey/BetterItemStack/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
logoFile = "icon.png"
authors = "${mod_author}"
credits = "${credits}"
description = '''${description}'''

# NeoForge 通过 manifest 的 MixinConfigs 找混入配置（见 neoforge/build.gradle）。

# 1.20.1 的 NeoForge 沿用了 loader 的 modid "forge"，因此这里依赖声明的仍是 forge。
[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
