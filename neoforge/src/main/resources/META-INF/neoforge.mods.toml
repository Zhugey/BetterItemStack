modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL = "https://github.com/Zhugey/BetterItemStack/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
logoFile = "icon.png"
authors = "${mod_author}"
credits = "${credits}"
description = '''${description}'''

# NeoForge 1.20.5 起改用 neoforge.mods.toml，混入配置在这里声明（不再走 manifest 的 MixinConfigs）。
[[mixins]]
config = "${mod_id}.mixins.json"

# 1.21.1 的 NeoForge 是独立实现，modid 就是 neoforge（不再是 1.20.1 那种沿用 forge 的镜像）。
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
