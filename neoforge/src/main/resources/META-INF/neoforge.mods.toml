modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL = "https://github.com/Zhugey/BetterItemStack/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
# NeoForge 26.2 起 logoFile 已弃用：方形图标用 iconFile，宽横幅用 bannerFile。
iconFile = "icon.png"
authors = "${mod_author}"
credits = "${credits}"
description = '''${description}'''

# NeoForge 1.20.5 起改用 neoforge.mods.toml，混入配置在这里声明（不走 manifest 的 MixinConfigs）。
[[mixins]]
config = "${mod_id}.mixins.json"
# 第二个配置**只有 NeoForge 需要**：NeoForge 给 ItemStack 补了自己的 getMaxStackSize()，
# 会绕开 ItemInstance 的默认方法 ⇒ 那个 @Overwrite 只在这里列（Fabric/Forge 没有该方法，列过去会让它们起不来）。
[[mixins]]
config = "${mod_id}.neoforge.mixins.json"

# 1.21.1 的 NeoForge 是独立实现，modid 就是 neoforge（不再是 1.20.1 那种沿用 forge 的镜像）。
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
